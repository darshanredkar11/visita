[package]
name        = "visitorpass-infrastructure"
description = "Concrete implementations: SQLx repositories, crypto, key provider, notifications."
version.workspace  = true
edition.workspace  = true
authors.workspace  = true
license.workspace  = true

[dependencies]
visitorpass-domain      = { path = "../domain" }
visitorpass-application = { path = "../application" }

# Async
tokio       = { workspace = true }
async-trait = { workspace = true }

# Database
sqlx = { workspace = true }

# Serialization
serde      = { workspace = true }
serde_json = { workspace = true }
ciborium   = { workspace = true }

# Cryptography
ed25519-dalek    = { workspace = true }
chacha20poly1305 = { workspace = true }
argon2           = { workspace = true }
sha2             = { workspace = true }
hmac             = { workspace = true }
hkdf             = { workspace = true }
rand             = { workspace = true }
rand_core        = { workspace = true }

# PASETO
pasetors = { workspace = true }

# IDs
uuid   = { workspace = true }
chrono = { workspace = true }

# Encoding
base64 = { workspace = true }
hex    = { workspace = true }

# Errors
thiserror = { workspace = true }
anyhow    = { workspace = true }

# Logging
tracing = { workspace = true }

# HTTP client (SMS provider calls)
reqwest = { workspace = true }

# Share channels: WhatsApp deep links, PDF pass cards
printpdf = { version = "0.11", default-features = false }
qrcode   = { version = "0.14", default-features = false }
percent-encoding = "2"

# Dev/test-only lock usage (SMS mock's captured-call-args store)
parking_lot = "0.12"

[dev-dependencies]
# Independent, low-level verification that generated PDFs really contain
# the expected text in their content stream (see share/pdf.rs tests) --
# deliberately NOT printpdf's own `extract_text()`, which has a known gap
# for builtin (non-embedded) fonts after a parse round-trip.
lopdf = { version = "0.44", default-features = false, features = ["time"] }
